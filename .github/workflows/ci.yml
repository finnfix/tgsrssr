name: CI

on:
  push:
    branches: ["*"]
  pull_request:

# Least privilege: default the GITHUB_TOKEN to read-only repo contents.
# No job here needs to write anything back to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked
