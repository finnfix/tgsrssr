name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Least privilege: default the GITHUB_TOKEN to read-only repo contents so jobs
# that only build/test cannot write back to the repo. Jobs needing more scope
# (release creation, image push) grant it explicitly at the job level below.
permissions:
  contents: read

jobs:
  # ===== CI gate (clippy + test) — blocks all downstream jobs =====
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          cargo_ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag_ver" != "$cargo_ver" ]; then
            echo "::error::Tag v${tag_ver} does not match Cargo.toml version ${cargo_ver}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # ===== Create GitHub Release (title + notes from annotated tag message) =====
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag message as release notes
        id: notes
        run: |
          git fetch origin tag "${{ github.ref_name }}" --no-tags --force
          {
            echo "body<<RELEASE_EOF"
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "tgsrssr ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}

  # ===== Docker multi-arch image (linux/amd64 + linux/arm64) =====
  docker:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.ver }}

  # ===== Static binaries (no Docker required for end users) =====
  binary:
    needs: [check, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64-linux
          - target: aarch64-unknown-linux-musl
            arch: aarch64-linux
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross (aarch64)
        if: matrix.cross
        run: cargo install cross

      - name: Build
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf tgsrssr-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz tgsrssr
          echo "ASSET=tgsrssr-${{ github.ref_name }}-${{ matrix.arch }}.tar.gz" >> "$GITHUB_ENV"

      # Sidecar checksum named after the archive ("<asset>.sha256") so users can
      # verify a download with `sha256sum -c <asset>.sha256` in the same folder.
      # The recorded path is the bare archive name, matching the Release asset.
      - name: Generate checksum
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/${{ env.ASSET }}
            target/${{ matrix.target }}/release/${{ env.ASSET }}.sha256
