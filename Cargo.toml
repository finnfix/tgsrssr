[package]
name = "tgsrssr"
version = "1.16.0"
edition = "2021"
rust-version = "1.96"
description = "Telegram's RSS Rust — RSS subscription Telegram bot (Rust)"
license = "MIT"

[dependencies]
# Bot framework
# Note: teloxide 0.17 has no "sqlite-storage" feature (it's sqlite-storage-rustls).
# Dialogue storage is not used in current code, so the feature is omitted.
# default-features disabled to avoid native-tls (openssl-sys); using rustls instead.
teloxide = { version = "0.17.0", default-features = false, features = [
    "macros",
    "ctrlc_handler",
    "rustls",
] }

# RSS parsing
feed-rs = "3.0.0"

# HTTP client
# Note: reqwest 0.13 renamed "rustls-tls" to "rustls"
reqwest = { version = "0.13.5", features = [
    "socks",
    "rustls",
    "stream",
], default-features = false }

# teloxide 0.17 pins reqwest 0.12; the bot client we inject must match it.
reqwest_bot = { package = "reqwest", version = "0.12.28", default-features = false, features = [
    "rustls-tls",
] }

# Database
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "chrono",
    "migrate",
] }

# Async runtime
tokio = { version = "1.53.3", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
dptree = "0.5.1"

# Image dimension probing (media classification: photo vs document)
imagesize = "0.15.0"

# Filesystem traversal (cleanup)
walkdir = "2.5.0"

# Serialization / time / URL
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4.45"
url = "2.5.8"

# Error handling
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

# Misc
uuid = { version = "1.28.0", features = ["v4"] }
regex = "1.13.1"
sha2 = "0.11.1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
